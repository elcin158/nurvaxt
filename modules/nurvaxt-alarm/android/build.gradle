apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'az.nurvaxt.alarm'
version = '1.0.0'

android {
  namespace 'az.nurvaxt.alarm'
  defaultConfig {
    versionCode 1; versionName '1.0.0'
    testInstrumentationRunner 'az.nurvaxt.alarm.CountdownTestRunner'
  }
}

dependencies {
  // Layouts use TextAppearance.Compat.Notification*; matches the version the app already resolves.
  implementation 'androidx.core:core:1.17.0'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'junit:junit:4.13.2'
}
